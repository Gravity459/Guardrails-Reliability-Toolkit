name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs uv; uv then installs the Python version from .python-version.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      # No secrets needed:
      # - tests/conftest.py sets a dummy Gemini key; every Gemini call is mocked.
      # - Guardrails Hub validators (ValidLength, ValidRange) need a hub token to
      #   install, so conftest.py registers stand-ins when they are missing.
      - name: Run tests
        run: uv run pytest -q
